[project]
name = "llmtr"
version = "0.1.0"
description = "Hotkey-driven translate, grammar fix and tone rewrite of selected text via local Ollama"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "tomasz.szymanski", email = "tomasz.szymanski@greenit.com.pl" }
]
requires-python = ">=3.13"
dependencies = []

[project.scripts]
llmtr = "llmtr:main"

[build-system]
requires = ["uv_build>=0.12.22,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "ollama: needs a running Ollama server (skipped unless LLMTR_OLLAMA_TESTS=1)",
    "cursor: needs the real Cursor API and key, host only (skipped unless LLMTR_CURSOR_TESTS=1)",
]
